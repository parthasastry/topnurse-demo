version: 1
# appRoot: apps/web — app code is in apps/web. All build commands run relative to apps/web.
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - echo "Node.js version"
            - node --version
            - echo "Installing dependencies..."
            - npm ci
            - echo "Dependencies installed successfully"
        build:
          commands:
            - echo "Building TopNurse frontend..."
            - npm run build
            - echo "Build completed successfully"
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - ../../node_modules/**/*
    env:
      variables:
        # Set in Amplify Console -> Environment variables
        # e.g. VITE_API_URL, VITE_AWS_REGION, VITE_USER_POOL_ID, VITE_USER_POOL_CLIENT_ID
